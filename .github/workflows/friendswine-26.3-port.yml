name: Friendswine 26.3 port build

on:
  push:
    branches:
      - "tmp/friendswine-26.3-port"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Fetch and prepare Friendswine source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jiaotan798/friendswine.git upstream
          cd upstream/ports/fabric-26.1.2
          sed -i "s/version '1.15.5'/version '1.18.4'/" build.gradle
          sed -i 's/mod_version=0.1.18/mod_version=0.1.18-26.3-port1/' gradle.properties
          sed -i 's/minecraft_version=26.1.2/minecraft_version=26.3/' gradle.properties
          sed -i 's/loader_version=0.19.4/loader_version=0.19.5/' gradle.properties
          sed -i 's/fabric_api_version=0.149.0+26.1.2/fabric_api_version=0.164.0+26.3/' gradle.properties
          sed -i 's/gradle-9.4.0-bin/gradle-9.7.1-bin/' gradle/wrapper/gradle-wrapper.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main/resources/fabric.mod.json")
          s = p.read_text(encoding="utf-8")
          s = s.replace('"minecraft": "26.1.2"', '"minecraft": "26.3"')
          s = s.replace('">=0.149.0+26.1.2"', '">=0.164.0+26.3"')
          p.write_text(s, encoding="utf-8")

          # Minecraft 26.3 migration fixes found by the first real compile.
          import re
          root = Path("src/main/java/com/friendswine")

          # Block codecs were removed in 26.3.
          p = root / "DollBlock.java"
          s = p.read_text(encoding="utf-8")
          s = "\n".join(line for line in s.splitlines() if line.strip() not in {
              "import com.mojang.serialization.MapCodec;",
              "public static final MapCodec<DollBlock> CODEC = simpleCodec(DollBlock::new);"
          }) + "\n"
          s = re.sub(r"\n    @Override\n    public MapCodec<DollBlock> codec\(\) \{\n        return CODEC;\n    \}\n", "\n", s)
          p.write_text(s, encoding="utf-8")

          # PoseStack now accepts Matrix4fc/Transformation rather than Quaternionf.
          p = root / "client" / "DollRenderer.java"
          s = p.read_text(encoding="utf-8")
          lines = [line for line in s.splitlines() if line.strip() != "import net.minecraft.client.renderer.MultiBufferSource;"]
          if "import org.joml.Matrix4f;" not in lines:
              lines.insert(lines.index("import com.mojang.math.Axis;") + 1, "import org.joml.Matrix4f;")
          s = "\n".join(lines) + "\n"
          s = s.replace("pose.mulPose(Axis.YP.rotationDegrees(state.yaw))", "pose.mulPose(new Matrix4f().rotation(Axis.YP.rotationDegrees(state.yaw)))")
          s = s.replace("pose.mulPose(Axis.YP.rotationDegrees(JellyAnimation.angle(animation.rotationSeconds() * ClientConfig.ROTATION_SPEED.get().doubleValue())))", "pose.mulPose(new Matrix4f().rotation(Axis.YP.rotationDegrees(JellyAnimation.angle(animation.rotationSeconds() * ClientConfig.ROTATION_SPEED.get().doubleValue()))))")
          p.write_text(s, encoding="utf-8")

          p = root / "client" / "PartyGuestRenderer.java"
          s = p.read_text(encoding="utf-8")
          lines = s.splitlines()
          if "import org.joml.Matrix4f;" not in lines:
              lines.insert(lines.index("import com.mojang.math.Axis;") + 1, "import org.joml.Matrix4f;")
          s = "\n".join(lines) + "\n"
          new_method = "\n".join([
              "    @Override public boolean shouldRender(PartyGuestEntity entity, Frustum frustum, double camX, double camY, double camZ, float partialTicks) {",
              "        double size = Math.max(1, ClientConfig.creatureMax(entity.variant()));",
              "        AABB bounds = new AABB(entity.getX() - size / 2, entity.getY(), entity.getZ() - size / 2,",
              "                entity.getX() + size / 2, entity.getY() + size, entity.getZ() + size / 2);",
              "        return entity.distanceToSqr(camX, camY, camZ) <= (128 + size) * (128 + size) && frustum.isVisible(bounds.inflate(0.5));",
              "    }"
          ])
          s, count = re.subn(r"    @Override public boolean shouldRender\(PartyGuestEntity entity, Frustum frustum, double camX, double camY, double camZ\) \{.*?\n    \}", new_method, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not locate PartyGuestRenderer.shouldRender to port")
          s = s.replace("pose.mulPose(Axis.YP.rotationDegrees(GuestAnimation.facingYaw(camera.pos.x - state.x, camera.pos.z - state.z, camera.yRot)))", "pose.mulPose(new Matrix4f().rotation(Axis.YP.rotationDegrees(GuestAnimation.facingYaw(camera.pos.x - state.x, camera.pos.z - state.z, camera.yRot))))")
          p.write_text(s, encoding="utf-8")

          # Screen switching moved from Minecraft to Gui.
          p = root / "client" / "FriendsWineClient.java"
          s = p.read_text(encoding="utf-8").replace("mc.setScreen(new SettingsScreen(mc.screen))", "mc.gui.setScreen(new SettingsScreen(mc.gui.screen()))")
          p.write_text(s, encoding="utf-8")
          p = root / "client" / "SettingsScreen.java"
          s = p.read_text(encoding="utf-8").replace("minecraft.setScreen(parent)", "minecraft.gui.setScreen(parent)")
          p.write_text(s, encoding="utf-8")
          PY
          cat gradle.properties
          grep -nE '"minecraft"|"fabric-api"|fabricloader|version' src/main/resources/fabric.mod.json

      - name: Compile mod JAR (capture all diagnostics)
        id: build
        shell: bash
        run: |
          set +e
          cd upstream/ports/fabric-26.1.2
          ./gradlew --no-daemon clean jar --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friendswine-26.3-build-diagnostics
          path: |
            upstream/ports/fabric-26.1.2/build.log
            upstream/ports/fabric-26.1.2/build/reports/**
          if-no-files-found: warn
          retention-days: 3

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: friendswine-26.3-jar
          path: upstream/ports/fabric-26.1.2/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
